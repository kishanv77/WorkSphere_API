spring.application.name=worksphere-api

# PostgreSQL connection values are supplied by the environment.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/worksphere}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway owns the production schema; Hibernate verifies it rather than changing it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

# Expose only a minimal health endpoint for local checks and deployment probes.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# JWT signing material must be supplied by the environment, never committed.
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.access-token-ttl=PT15M

# Fail fast on invalid migration file names.
spring.flyway.validate-migration-naming=true

# Authentication is handled by the custom JWT filter; skip the generated in-memory user.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Browser origins allowed to call the API (comma-separated).
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
